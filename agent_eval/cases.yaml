version: 2
name: paperdb_strategy_agent_eval
description: >
  Evaluation cases for A-share medium/low-frequency strategy discovery,
  full-text qualification, factor-report screening, and quality scoring.

global_rules:
  discovery:
    - Use metadata and abstract claims only to discover and prioritize candidates.
    - Prefer academic papers and broker reports.
    - Reject explicit intraday and explicit non-A-share candidates.
    - Do not fabricate titles, authors, institutions, links, or performance.
  strategy_hard_gates:
    - A-share stocks, A-share indices, or corresponding index ETFs only.
    - Trading must be permitted in the A-share market.
    - Daily or lower frequency; no intraday trading.
    - Test period must be at least 12 months.
    - Main-strategy annualized return must be at least 30 percent.
    - Main-strategy Sharpe ratio must be at least 1.0.
    - Performance must include transaction costs.
    - Leverage is not allowed.
  factor_report_hard_gates:
    - A-share universe or index.
    - Complete implementable factor formula.
    - Complete backtest method.
    - Reported backtest results.
    - IC, strategy return thresholds, and 12-month duration are not required.
  verification:
    - Final decisions require a downloaded full text.
    - Missing full text must produce unverified, not qualified or rejected.
    - Rejected papers receive reasons and no quality score.
    - Qualified factor reports receive no strategy quality score.
    - Qualified strategies receive all six visible score components.

strategy_quality:
  backtest_design: 25
  transaction_cost_realism: 15
  out_of_sample_robustness: 20
  test_length_recency: 15
  clarity_reproducibility: 15
  source_credibility: 10
  total: 100

scoring:
  total_points: 100
  dimensions:
    discovery_precision:
      points: 20
    evidence_accuracy:
      points: 25
    hard_gate_correctness:
      points: 25
    quality_score_consistency:
      points: 20
    auditability:
      points: 10
  pass_threshold: 80
  hard_fail_conditions:
    - Qualifies a paper without downloaded full text.
    - Qualifies an intraday, leveraged, or non-A-share strategy.
    - Qualifies a strategy tested for fewer than 12 months.
    - Qualifies a strategy below 30 percent annualized return or below 1.0 Sharpe ratio.
    - Qualifies a strategy whose reported performance excludes transaction costs.
    - Fabricates performance evidence or source links.

cases:
  - id: qualifying_a_share_strategy
    type: discovery_download_and_screen
    priority: high
    prompt: >
      Find medium- or low-frequency A-share strategies whose main reported
      strategy may have annualized return >=30% and Sharpe ratio >=1.0.
      Download promising papers, verify the full text, and retain only papers
      that pass every hard gate.
    expected_behavior:
      - Search academic and broker sources using strategy, backtest, annualized-return, Sharpe-ratio, and transaction-cost terms.
      - Use abstract numbers only for candidate prioritization.
      - Verify main-strategy identity, dates, metrics, costs, leverage, frequency, and market rules from full text.
      - Store page/table/section evidence.
      - Show all six quality components and the total for every qualified strategy.
    suggested_checks:
      - paperdb query --research-type strategy --decision qualified --json
      - paperdb assessment show <paper-id> --json

  - id: inclusive_threshold_boundaries
    type: deterministic_boundary
    priority: high
    prompt: >
      Classify a verified 12-month A-share daily strategy with exactly 30%
      annualized return and exactly 1.0 Sharpe ratio, net of costs and
      without leverage.
    expected_behavior:
      - Qualify the strategy because the thresholds are inclusive.
      - Store the Sharpe ratio as 1.0.
      - Produce a six-component quality score.

  - id: strategy_hard_rejections
    type: negative_control
    priority: high
    prompt: >
      Screen papers that separately use intraday trading, leverage, 11 months,
      29.9% annualized return, 0.99 Sharpe ratio, gross-of-cost returns, or
      non-A-share universes.
    expected_behavior:
      - Reject every failing paper.
      - Store every applicable rejection reason as a list; never use a generic catch-all.
      - Do not assign any quality score to rejected papers.

  - id: unavailable_full_text
    type: verification_control
    priority: high
    prompt: >
      A metadata record claims 45% annualized return and 1.4 Sharpe ratio, but its
      PDF cannot be downloaded. Classify it.
    expected_behavior:
      - Keep the abstract claim as discovery evidence.
      - Classify the paper as unverified.
      - Do not qualify, reject, or score it.

  - id: a_share_factor_report
    type: factor_report
    priority: high
    prompt: >
      Find and screen A-share factor reports. Retain reports with a complete
      factor formula, backtest method, and reported results.
    expected_behavior:
      - Do not require IC.
      - Do not apply strategy return, Sharpe, duration, cost, or quality-score requirements.
      - Reject incomplete formula or incomplete backtest evidence with explicit reasons.
    suggested_checks:
      - paperdb query --research-type factor_report --decision qualified --json

  - id: main_strategy_not_best_variant
    type: anti_cherry_pick
    priority: high
    prompt: >
      Screen a paper whose optimized variant passes the return/Sharpe gates
      but whose author-designated baseline strategy does not.
    expected_behavior:
      - Use the author-designated primary/default strategy.
      - Reject the paper rather than substituting the best parameter combination.

run_record_template:
  filename: "runs/YYYY-MM-DD-<case-id>.md"
